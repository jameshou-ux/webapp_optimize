<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" role="img" aria-labelledby="title desc">
  <title id="title">DeFi Summer promo image</title>
  <desc id="desc">Abstract token campaign artwork with layered blue and violet token bubbles.</desc>
  <defs>
    <linearGradient id="bg" x1="25" y1="18" x2="188" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19c7ff"/>
      <stop offset=".56" stop-color="#007fff"/>
      <stop offset="1" stop-color="#7054f5"/>
    </linearGradient>
    <linearGradient id="coin" x1="75" y1="34" x2="147" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8f2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="260" height="210" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f4cc8" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect x="18" y="16" width="184" height="128" rx="34" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="146" cy="52" r="48" fill="#fff" opacity=".12"/>
  <circle cx="78" cy="122" r="54" fill="#fff" opacity=".1"/>
  <circle cx="111" cy="78" r="42" fill="url(#coin)"/>
  <path d="M80 88c23-39 57-42 82-22-14 31-47 43-82 22Z" fill="#007fff" opacity=".9"/>
  <path d="M92 87c21-3 40-11 59-25" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".9"/>
  <circle cx="63" cy="50" r="20" fill="#fff" opacity=".88"/>
  <circle cx="161" cy="111" r="17" fill="#fff" opacity=".74"/>
</svg>
